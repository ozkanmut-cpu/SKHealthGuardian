name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build mobile and wear APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run shared alarm tests
        run: gradle --no-daemon --stacktrace :shared:testDebugUnitTest

      - name: Build debug APKs
        run: gradle --no-daemon --stacktrace :mobile:assembleDebug :wear:assembleDebug

      - name: Upload mobile APK
        if: always() && hashFiles('mobile/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SKHealthGuardian-Mobile-Debug
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload wear APK
        if: always() && hashFiles('wear/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SKHealthGuardian-Wear-Debug
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
